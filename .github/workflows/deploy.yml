name: Deploy to GitHub Pages

# Strona główna to statyczne pliki w katalogu głównym repo (index.html,
# style.css, script.js, assets/) plus dema w podfolderach. Nie ma etapu budowania:
# repo jest pakowane w całości i publikowane jako artefakt Pages.
#
# Pages w ustawieniach repo działa w trybie "GitHub Actions", więc bez tego
# workflowu push do master nie wdraża niczego.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
